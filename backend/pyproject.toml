[project]
name = "nasdaq100-backtester-backend"
version = "0.1.0"
description = "High-speed local Nasdaq-100 5-minute scalping backtesting platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "polars>=1.14.0",
    "numpy>=2.1.0",
    "numba>=0.61.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

